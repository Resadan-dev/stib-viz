[project]
name = "stibviz"
version = "0.1.0"
description = "stib-viz pipeline: turns the STIB GTFS feed into trajectories for the website."
authors = [{ name = "Dany Vanmuylder" }]
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.urls]
Repository = "https://github.com/Resadan-dev/stib-viz"

[project.scripts]
stibviz = "stibviz.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# The data licence mandates "Source: STIB-MIVB – Open Data – [date]" with en dashes.
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=stibviz --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["stibviz"]
