[project]
name = "stibviz"
version = "0.1.0"
description = "Pipeline de stib-viz : transforme le GTFS STIB en trajectoires pour le site."
authors = [
    { name = "Dany Vanmuylder", email = "danydynamo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stibviz = "stibviz.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=stibviz --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["stibviz"]
